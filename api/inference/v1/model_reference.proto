syntax = "proto3";
package inference.v1;
option go_package = "github.com/zhangzhe-ctrl/ani-inference-service/api/inference/v1;inferencev1";

// Tenant identity is supplied by the authenticated transport, never this request.
service ModelReferenceService {
  rpc CheckModelVersionReferences(CheckModelVersionReferencesRequest) returns (CheckModelVersionReferencesResponse);
}
message CheckModelVersionReferencesRequest {
  // One to 256 actual ModelVersion UUIDs. Service/operation/model IDs are invalid selectors.
  repeated string model_version_ids = 1;
}
message CheckModelVersionReferencesResponse { bool has_active_references = 1; }
