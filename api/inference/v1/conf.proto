syntax = "proto3";

package inference.v1;

option go_package = "github.com/zhangzhe-ctrl/ani-inference-service/api/inference/v1;inferencev1";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  // Optional managed Governance command/refund wiring. When configured, both
  // inbound and outbound identities are required; no plaintext fallback.
  ManagedGPU managed_gpu = 2;
}

message ManagedGPU {
  message Receiver {
    string ca_file = 1;
    string cert_file = 2;
    string key_file = 3;
    // Dedicated internal listener; the existing CPU/model-reference listener
    // retains its own transport contract.
    string address = 4;
  }
  message Refund {
    string address = 1;
    string ca_file = 2;
    string cert_file = 3;
    string key_file = 4;
    string server_name = 5;
    google.protobuf.Duration timeout = 6;
  }
  message LWSAdmission {
    // Explicit TLS listener for synchronous managed LWS CREATE/UPDATE.
    string address = 1;
    string ca_file = 2;
    string cert_file = 3;
    string key_file = 4;
    // Exact single DNS SAN of the Kubernetes API server's client certificate.
    string api_server_client_dns_name = 5;
    // Exact authenticated KServe controller service-account username.
    string controller_username = 6;
  }
  Receiver receiver = 1;
  Refund refund = 2;
  // Required whenever the managed Governance receiver is configured.
  LWSAdmission lws_admission = 3;
}

message Server {
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  message Admin {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  GRPC grpc = 1;
  Admin admin = 2;
  google.protobuf.Duration shutdown_timeout = 3;
}
