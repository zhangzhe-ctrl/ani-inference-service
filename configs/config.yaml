server:
  grpc:
    network: "${SERVER_GRPC_NETWORK:tcp}"
    addr: "${SERVER_GRPC_ADDR:127.0.0.1:19090}"
    timeout: "${SERVER_GRPC_TIMEOUT:1s}"
  admin:
    network: "${SERVER_ADMIN_NETWORK:tcp}"
    addr: "${SERVER_ADMIN_ADDR:127.0.0.1:19091}"
    timeout: "${SERVER_ADMIN_TIMEOUT:1s}"
  shutdown_timeout: "${SERVER_SHUTDOWN_TIMEOUT:5s}"
managed_gpu:
  receiver:
    address: "${GOVERNANCE_RECEIVER_GRPC_ADDR:}"
    ca_file: "${GOVERNANCE_RECEIVER_CA_FILE:}"
    cert_file: "${GOVERNANCE_RECEIVER_CERT_FILE:}"
    key_file: "${GOVERNANCE_RECEIVER_KEY_FILE:}"
  refund:
    address: "${GOVERNANCE_QUOTA_GRPC_ADDR:}"
    ca_file: "${GOVERNANCE_QUOTA_CA_FILE:}"
    cert_file: "${GOVERNANCE_QUOTA_CERT_FILE:}"
    key_file: "${GOVERNANCE_QUOTA_KEY_FILE:}"
    server_name: "${GOVERNANCE_QUOTA_SERVER_NAME:}"
    timeout: "${GOVERNANCE_QUOTA_TIMEOUT:5s}"
